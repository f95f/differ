<header class="page-title">
  <h1>    
    <span class="material-symbols-outlined">home_storage_gear</span>
    Dev tools
  </h1>
  <button
    class="theme-button"
    type="button"
    [attr.aria-label]="'Switch to ' + (themeService.theme() === 'light' ? 'dark' : 'light') + ' theme'"
    (click)="themeService.toggleTheme()">
    <span class="tile-icon material-symbols-outlined">routine</span>  
  </button>
</header>

<nav>

  <button class="tile-button" type="button" routerLink="/differ">
    <span class="tile-icon material-symbols-outlined">text_compare</span>  
    <h2 class="tile-title">Differ</h2>
    <p class="tile-description">Compare text side-by-side</p>
  </button>

  <button class="tile-button" type="button" routerLink="/indenter">
    <span class="tile-icon material-symbols-outlined">format_indent_increase</span>
    <h2 class="tile-title">Indenter</h2>
    <p class="tile-description">Format json indentation</p>
  </button>

</nav>
